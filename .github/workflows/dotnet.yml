name: dotnet

on:
  pull_request:
    paths: ['dotnet/**', '.github/workflows/dotnet.yml']
  push:
    branches: [main]
    paths: ['dotnet/**', '.github/workflows/dotnet.yml']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test dotnet/Tinysnap.slnx --configuration Release
